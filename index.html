<!DOCTYPE html>

    <!-- Google tag (gtag.js) -->

    <title>Activa · One membership. Many ways to move.</title>
    <meta
      name="description"
      content="Activa connects people and companies with gyms, studios and wellness services in Costa Rica through one flexible membership. Join our pilot."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#faf8f4" />
    <meta name="author" content="Activa" />
    <meta
      name="keywords"
      content="Activa, membresía wellness, gimnasios Costa Rica, bienestar corporativo, yoga, pilates, boxeo, fitness, San José, Escazú"
    />
    <link rel="canonical" href="https://4ctiva.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Activa" />
    <!-- One URL serves both languages (client-side toggle, English by default),
         so there is no per-language URL to declare with hreflang or og:locale:alternate. -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Activa · One membership. Many ways to move." />
    <meta
      property="og:description"
      content="Activa connects people and companies with gyms, studios and wellness services in Costa Rica through one flexible membership."
    />
    <meta property="og:url" content="https://4ctiva.com/" />
    <!-- Existing brand mark; replace with a 1200×630 share image once one is approved. -->
    <meta property="og:image" content="https://4ctiva.com/favicon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Activa logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://4ctiva.com/favicon-512x512.png" />
    <meta name="twitter:title" content="Activa · One membership. Many ways to move." />

      name="twitter:description"
      content="Activa connects people and companies with gyms, studios and wellness services in Costa Rica through one flexible membership."
    />

      #root { height: 100%; }
